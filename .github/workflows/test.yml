concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, repoened, synchronize]

jobs:
  native-test-libraries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust_toolchain: [nightly, stable, 1.95.0]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    timeout-minutes: 20
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v3
      - run: rustup install ${{ matrix.rust_toolchain }} --profile=minimal
      - run: rustup default ${{ matrix.rust_toolchain }}
      # FIXME: perhaps make this into a scrupt?
      - run: cargo check -p tracy-client-sys
      - run: cargo check -p tracy-client
      - run: cargo check -p tracing-tracy
      - run: cargo check -p tracy-client-examples
      - run: cargo check -p tracy-client-sys --no-default-features
      - run: cargo check -p tracy-client --no-default-features
      - run: cargo check -p tracing-tracy --no-default-features
      - run: cargo check -p tracy-client-sys --features=manual-lifetime
      - run: cargo check -p tracy-client --features=manual-lifetime
      - run: cargo check -p tracing-tracy --features=manual-lifetime
      - run: cargo check -p tracy-client-sys --features=enable,fibers,system-tracing,context-switch-tracing,sampling,code-transfer,broadcast,only-localhost,only-ipv4,timer-fallback,ondemand,manual-lifetime,callstack-inlines,wait-stacks
      - run: cargo check -p tracy-client --features=enable,fibers,system-tracing,context-switch-tracing,sampling,code-transfer,broadcast,only-localhost,only-ipv4,timer-fallback,ondemand,manual-lifetime,callstack-inlines,wait-stacks
      - run: cargo check -p tracing-tracy --features=enable,fibers,system-tracing,context-switch-tracing,sampling,code-transfer,broadcast,only-localhost,only-ipv4,timer-fallback,ondemand,manual-lifetime,callstack-inlines,wait-stacks
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -nE 's/.*(Major|Minor|Patch) = ([0-9]+);.*/\2/p' \
                      tracy-client-sys/tracy/common/TracyVersion.hpp | paste -sd.)
          curl -sSfL "https://github.com/wolfpld/tracy/releases/download/v$version/linux-$version.zip" \
            -o "$RUNNER_TEMP/tracy.zip"
          unzip -o "$RUNNER_TEMP/tracy.zip" tracy-capture tracy-csvexport -d "$RUNNER_TEMP/tracy"
          chmod +x "$RUNNER_TEMP/tracy/tracy-capture" "$RUNNER_TEMP/tracy/tracy-csvexport"
          echo "TRACY_TOOLS_DIR=$RUNNER_TEMP/tracy" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace ${{ matrix.flags }} --no-capture
        env:
          TRACY_NO_INVARIANT_CHECK: 1
      - run: cargo nextest run --workspace ${{ matrix.flags }} --release --no-capture
        env:
          TRACY_NO_INVARIANT_CHECK: 1
      - run: cargo nextest run --workspace ${{ matrix.flags }} --features=manual-lifetime,fibers --no-capture
        env:
          TRACY_NO_INVARIANT_CHECK: 1
      - run: cargo test --workspace ${{ matrix.flags }} --doc
      - run: cargo nextest run -p tracy-client --features=manual-lifetime --lib --release
        env:
          RUSTFLAGS: --cfg loom
          TRACY_TOOLS_DIR: ""

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update
      - run: sudo apt-get -y install libdebuginfod-dev
      - run: rustup install nightly --profile=minimal
      - run: rustup default nightly
      - run: cargo rustdoc --all-features -p tracy-client-sys -Zunstable-options --config 'build.rustdocflags=["--cfg", "tracy_client_sys_docs", "-D", "rustdoc::broken_intra_doc_links"]'
      - run: cargo rustdoc --all-features -p tracy-client -Zunstable-options --config 'build.rustdocflags=["--cfg", "tracy_client_docs", "-D", "rustdoc::broken_intra_doc_links"]'
      - run: cargo rustdoc --all-features -p tracing-tracy -Zunstable-options --config 'build.rustdocflags=["--cfg", "tracing_tracy_docs", "-D", "rustdoc::broken_intra_doc_links"]'
